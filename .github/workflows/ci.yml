name: BO Web CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: ESLint + TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: ESLint
        run: npx next lint

      - name: Aucune écriture ELO côté client (components/, app/)
        run: npm run check:elo-writes

      - name: TypeScript check
        run: |
          touch next-env.d.ts
          npx tsc --noEmit --skipLibCheck
